name: Build container

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-run-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test deployment scripts without cloud access
        run: prove -lv t/deployment_scripts.t
      - name: Build Linux container
        run: docker build --pull --platform linux/amd64 --tag api-proxy:test .
      - name: Run offline application tests
        run: docker run --rm --entrypoint prove api-proxy:test -IAPIProxy/lib -lr APIProxy/t
      - name: Smoke test non-root container on a non-default port
        shell: bash
        run: |
          set -euo pipefail
          container="$(docker run --detach --read-only --tmpfs /tmp \
            --publish 127.0.0.1:8081:8081 --env PORT=8081 api-proxy:test)"
          trap 'docker logs "$container"; docker rm --force "$container" >/dev/null' EXIT
          test "$(docker exec "$container" id -u)" != 0
          for _attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8081/ > /tmp/api-proxy-index.html; then
              grep --quiet '<title>APIProxy</title>' /tmp/api-proxy-index.html
              exit 0
            fi
            sleep 1
          done
          echo 'Container did not become ready' >&2
          exit 1

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
      AR_REPO: ${{ vars.GCP_AR_REPO || 'containers' }}
      IMAGE_NAME: api-proxy
      TAG: ${{ github.sha }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - name: Google Auth (WIF)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - id: build
        name: Build and push the tested commit
        run: bin/build_container

  deploy:
    needs: publish
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      digest: ${{ needs.publish.outputs.digest }}
    secrets: inherit
