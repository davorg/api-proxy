name: Build release image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
      AR_REPO: ${{ vars.GCP_AR_REPO || 'containers' }}
      IMAGE_NAME: api-proxy
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(perl -MExtUtils::MakeMaker -e 'print MM->parse_version($ARGV[0])' \
            APIProxy/lib/APIProxy.pm)"
          if [[ "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "Error: release tag '$GITHUB_REF_NAME' must match application version 'v${version}'" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Error: release tags must point to a commit on main" >&2
            exit 1
          fi
      - name: Google Auth (WIF)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - id: build
        name: Build and push release image
        run: bin/build_container
      - name: Save immutable image reference for deployment
        uses: actions/upload-artifact@v4
        with:
          name: release-image-ref
          path: image_ref.txt
          if-no-files-found: error
          retention-days: 7
